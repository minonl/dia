name: publish

# npm Trusted Publishing：OIDC 换短时凭据，仓库里不放 token。
# 前置（npmjs.com → @minonl/dia → Settings → Trusted Publisher）：
#   Publisher: GitHub Actions
#   Repository: minonl/dia
#   Workflow filename: publish.yml
#   Environment: (留空)
# 注意：npm provenance 要求包源码可公开访问；仓库仍为 private 时 publish 会失败，
#       需要先去 public-release 门禁（docs/security/public-release.md）。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC：npm 用它签发短时凭据

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      # 不要设 registry-url：setup-node 会写 _authToken=${NODE_AUTH_TOKEN} 占位，
      # npm 会优先用这个空 token 而不走 OIDC（npm/cli#8730）。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 确保 npm >= 11.5.1（OIDC 最低要求）
        run: |
          npm install -g npm@latest
          v=$(npm -v); echo "npm $v"
          major=${v%%.*}
          if [ "$major" -lt 11 ]; then echo "::error::npm $v 不支持 trusted publishing"; exit 1; fi
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test tests
      - name: 版本 → dist-tag（预发布走 next，正式走 latest）
        id: tag
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V"
          case "$V" in
            *-*) echo "tag=next"; echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest"; echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: publish (trusted; provenance 仅公开仓可用)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "private repo → 不发 provenance（npm 已知限制）；dist-tag=$TAG"
            npm publish --access public --tag "$TAG" --provenance=false
          else
            npm publish --access public --tag "$TAG" --provenance
          fi
