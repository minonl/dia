name: publish

# npm Trusted Publishing：OIDC 换短时凭据，仓库里不放 token。
# 前置（npmjs.com → @minonl/dia → Settings → Trusted Publisher）：
#   Publisher: GitHub Actions
#   Repository: minonl/dia
#   Workflow filename: publish.yml
#   Environment: (留空)
# 注意：npm provenance 要求包源码可公开访问；仓库仍为 private 时 publish 会失败，
#       需要先去 public-release 门禁（docs/security/public-release.md）。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC：npm 用它签发短时凭据

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      # registry-url 需要保留（否则 npm 不认为有 registry，直接 ENEEDAUTH）；
      # 但 setup-node 会写 _authToken=${NODE_AUTH_TOKEN} 占位，npm 看到"有 auth"就不走 OIDC。
      # 所以下一步把 _authToken 行删掉（npm/documentation#1960 的 workaround）。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: 去掉占位 token，让 npm 走 OIDC
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "npmrc=$npmrc"
          grep -n "registry" "$npmrc" || true
          sed -i '/_authToken/d' "$npmrc" || true
          echo "--- after ---"; cat "$npmrc" || true
      - name: 确保 npm >= 11.5.1（OIDC 最低要求）
        run: |
          npm install -g npm@latest
          v=$(npm -v); echo "npm $v"
          major=${v%%.*}
          if [ "$major" -lt 11 ]; then echo "::error::npm $v 不支持 trusted publishing"; exit 1; fi
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test tests
      - name: graph-web 打包冒烟（安装 tarball 后真跑一次）
        run: |
          set -e
          TGZ=$(npm pack --silent | tail -1)
          T=$(mktemp -d)
          npm i --prefix "$T" "./$TGZ" >/dev/null
          DIA_ROOT="$T/data" "$T/node_modules/.bin/dia" graph --serve --no-open >"$T/log" 2>&1 &
          pid=$!
          for i in $(seq 1 20); do grep -q "dia graph web:" "$T/log" && break; sleep 0.5; done
          url=$(sed -n 's/^dia graph web: //p' "$T/log" | head -1)
          [ -n "$url" ] || { cat "$T/log"; kill $pid || true; exit 1; }
          port=$(printf '%s' "$url" | sed -E 's#http://127\.0\.0\.1:([0-9]+)/.*#\1#')
          curl -fsS -c "$T/cj" -b "$T/cj" -L "$url" -o /dev/null
          curl -fsS -b "$T/cj" "http://127.0.0.1:$port/api/health"
          kill $pid || true
          echo "graph-web smoke ok"
      - name: OIDC preflight（诊断用，不打印 token）
        run: |
          set -u
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::缺少 id-token 环境变量（检查 permissions: id-token: write）"
            exit 1
          fi
          echo "id-token env: present"
          ID=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("value",""))')
          [ -n "$ID" ] || { echo "::error::拿不到 OIDC id token"; exit 1; }
          code=$(curl -s -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ID" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@minonl%2fdia")
          echo "exchange status: $code"
          if [ "$code" != "200" ]; then echo "--- body ---"; cat /tmp/exchange.json; fi
      - name: 包内容断言（deps/platforms 依赖 docs 回退）
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const j = require("/tmp/pack.json");
            // npm 12 返回 { "<name>": { files: [...] } }；旧版返回 [{ files: [...] }]。
            const pkg = Array.isArray(j) ? j[0] : j[Object.keys(j)[0]];
            const files = (pkg && pkg.files ? pkg.files : []).map((f) => f.path);
            const need = ["docs/deps.jsonl", "docs/platforms/registry.json", "packages/graph-web/dist/main.js", "packages/graph-web/bin/dia-graph-web"];
            const missing = need.filter((n) => !files.includes(n));
            if (missing.length) { console.error("tarball missing:", missing.join(", ")); process.exit(1); }
            console.log("tarball ok:", files.length, "files");
          '
      - name: 版本 → dist-tag（预发布走 next，正式走 latest）
        id: tag
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V"
          case "$V" in
            *-*) echo "tag=next"; echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest"; echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: publish (trusted; provenance 仅公开仓可用)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "private repo → 不发 provenance（npm 已知限制）；dist-tag=$TAG"
            npm publish --access public --tag "$TAG" --provenance=false
          else
            npm publish --access public --tag "$TAG" --provenance
          fi
