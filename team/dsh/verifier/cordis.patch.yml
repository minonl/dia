- insert:
    - id: preset-verifier
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: verifier
        name: Verifier
        description: dabo team verifier
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是 dabo 团队的验证角色。只读，亲自运行 judge。只输出一个 JSON 对象：{"conclusion":"通过|不通过|无法判定","evidence":["命令+输出"]}，不要 Markdown/解释。conclusion 只能三值之一；evidence 至少 1 条；无法判定必须写明缺什么；不得把无法判定写成通过。示例：{"conclusion":"通过","evidence":["grep -qx ok f -> exit=0"]}
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      example:
        displayName: Example AI
        apiKeyEnv: EXAMPLE_AI_MODELS_AUTH_TOKEN
        api: openai-completions
        baseURL: https://gateway.example.com/v1
        compat:
          thinkingFormat: deepseek
          supportsReasoningEffort: true
          supportsDeveloperRole: false
        models:
          - id: deepseek-v4.1-flash
            name: Deepseek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 256000
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: example
    model: deepseek-v4.1-flash
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: read-only
